<!-- Anonymous website statistics (Umami Cloud): page views and which links are tapped. No cookies and nothing
     stored on the visitor's device, so no consent banner is needed; /privacy/#website describes it. -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="781ae63a-280b-4bf3-8ffb-2f7622b42a3c"></script>
<script>
// Every link tap, inside the site or out of it: which page, which link.
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[href]');
  if (!a || !window.umami) return;
  window.umami.track('link_click', {
    url: a.href,
    text: (a.textContent || '').trim().slice(0, 100),
    page: location.pathname,
    outbound: a.hostname !== location.hostname
  });
}, true);
</script>
